<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order | Come to Ghana</title>
<meta name="description" content="Your Come to Ghana order: order number, what you bought, what happens next and a receipt to download.">
<link rel="stylesheet" href="../css/tokens.css"> <link rel="stylesheet" href="../css/layout.css"> <link rel="stylesheet" href="../css/site.css"> <link rel="stylesheet" href="../css/shop/core.css"> <link rel="stylesheet" href="../css/shop/cart.css"> <link rel="stylesheet" href="../css/shop/order.css">
<script defer src="../js/nav.js"></script> <script defer src="../js/motion.js"></script> <script defer src="../js/app.js"></script> <script defer src="../js/shop/core.js"></script> <script defer src="../js/shop/cart.js"></script>
<script defer src="../js/shop/order.js"></script>
</head>
<body>
<main id="main" class="ord">
  <header class="band band--dark ord-hero">
    <p class="eyebrow" id="ord-eyebrow">Your order</p>
    <h1 id="ord-title">Checking your order</h1>
    <div id="ord-hero-extra" hidden>
      <p class="ord-num-label">Order number</p>
      <p class="ord-num" id="ord-num"></p>
      <p class="ord-code-line">Order code <span class="ord-code" id="ord-code"></span>. Keep this page: the link is your order.</p>
      <ol class="ord-steps" id="ord-steps" aria-label="Order progress"></ol>
    </div>
  </header>
  <section class="band ord-body" aria-label="Order details">
    <p class="shop-testmoney" role="note">Demo shop: test payments only. No real money moves.</p>
    <div id="ord-app" aria-live="polite"><p class="ord-muted">Loading your order…</p></div>
  </section>
  <noscript><p>The order page needs JavaScript to load your order. Your receipt is also kept in My purchases.</p></noscript>
</main>
</body>
</html>
